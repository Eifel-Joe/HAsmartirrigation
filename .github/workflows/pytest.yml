name: Test Irrigation Plus

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout Irrigation Plus
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=custom_components.irrigation_plus --cov-report=xml --cov-report=term-missing --ignore-glob="**/test_*.py.disabled"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-ha-floor:
    # The oldest Home Assistant hacs.json declares. requirements.test.txt floats
    # to the newest release, so without this job that floor was a claim nothing
    # ran. pytest-homeassistant-custom-component pins exactly one HA version per
    # release, and 0.13.243 is the one for 2025.5.0. Keep the two in step with
    # hacs.json whenever the floor moves.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Irrigation Plus
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the floor Home Assistant
        run: |
          python -m pip install --upgrade pip uv
          # HA 2025.5.0 pins lru-dict==1.3.0, which has no Python 3.13 wheel;
          # 1.4.1 is the same API and has one.
          echo "lru-dict==1.4.1" > /tmp/overrides.txt
          uv pip install --system --override /tmp/overrides.txt \
            "homeassistant==2025.5.0" \
            "pytest-homeassistant-custom-component==0.13.243" \
            -r custom_components/irrigation_plus/requirements.txt \
            pytest-cov freezegun respx syrupy

      - name: Run tests against the floor
        env:
          # Lingering timers warn instead of failing here; see conftest.py.
          IRRIGATION_PLUS_HA_FLOOR: "1"
        run: |
          pytest tests/ -q --ignore-glob="**/test_*.py.disabled"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Irrigation Plus
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff linter
        run: ruff check custom_components/irrigation_plus/ --output-format=github

      - name: Check code formatting with black
        run: black --check custom_components/irrigation_plus/
